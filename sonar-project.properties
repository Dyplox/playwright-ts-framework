# SonarCloud (https://sonarcloud.io) – static analysis of the framework code itself.
# Create the project in SonarCloud with these keys (or edit them) and add the SONAR_TOKEN secret.
sonar.organization=dyplox
sonar.projectKey=Dyplox_playwright-ts-framework
sonar.projectName=playwright-ts-framework

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts
sonar.exclusions=**/node_modules/**,tests/__screenshots__/**
sonar.sourceEncoding=UTF-8

# Reuse ESLint findings (typescript-eslint + eslint-plugin-playwright) produced by the quality job.
sonar.eslint.reportPaths=eslint-report.json

# Page objects and fixtures repeat locator wiring by design; keep duplication analysis on logic.
sonar.cpd.exclusions=src/pages/**,src/fixtures/**
