version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Playwright and its image move together; visual baselines may need the
      # "Update visual baselines" workflow after this PR.
      playwright:
        patterns: ['@playwright/test', 'playwright*']
      lint-and-types:
        patterns: ['eslint*', '@eslint/*', 'typescript', 'typescript-eslint', 'prettier', '@types/*']
      reporting:
        patterns: ['allure-*', '@lhci/*']
      test-libraries:
        patterns: ['@axe-core/*', '@faker-js/*', 'zod', 'ajv*', 'dotenv', 'cross-env']
    ignore:
      # typescript-eslint 8.x only supports typescript <6.1. A TypeScript major breaks `npm ci`
      # (ERESOLVE). Revisit when typescript-eslint declares support for the next major.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types must match the Node runtime (.nvmrc = 22). Bump this together with .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    # Workflows AND the composite actions they use, so versions never drift apart.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
