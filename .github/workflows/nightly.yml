name: Nightly

# Full regression every night (01:17 Bogota) on the same pipeline as CI, and publication of
# the reports to GitHub Pages, so trends in Allure keep one data point per day.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Must cover every permission requested by jobs in ci.yml.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  regression:
    uses: ./.github/workflows/ci.yml
    with:
      grep: ''
    secrets: inherit
