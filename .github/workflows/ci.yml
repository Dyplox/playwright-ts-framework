name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter for the functional suite, e.g. @smoke, @e2e, @a11y, @mock (empty = everything)'
        required: false
        default: ''
  # Reused by nightly.yml
  workflow_call:
    inputs:
      grep:
        type: string
        required: false
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEST_ENV: local
  GREP: ${{ inputs.grep || '' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: ESLint (+ JSON report for SonarCloud)
        run: npx eslint . -f json -o eslint-report.json || npx eslint .
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 3

  sonarcloud:
    name: SonarCloud
    needs: quality
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for blame / new-code detection
      - uses: actions/download-artifact@v4
        with:
          name: eslint-report
      - name: Skip notice
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::notice::SONAR_TOKEN secret not set, skipping SonarCloud analysis."
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io

  e2e:
    name: Functional shard ${{ matrix.shard }}/4
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Toolshop (Docker)
        run: ./scripts/toolshop.sh up

      - name: API + Chromium + Firefox + WebKit (shard ${{ matrix.shard }}/4)
        run: >
          npx playwright test --project=api --project=chromium --project=firefox --project=webkit
          --shard=${{ matrix.shard }}/4 ${GREP:+--grep "$GREP"}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-e2e-${{ matrix.shard }}
          path: blob-report
          retention-days: 3
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-${{ matrix.shard }}
          path: allure-results
          retention-days: 3
      # Traces and videos only exist for failed tests (retain-on-failure).
      - name: Upload traces & videos of failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failures-e2e-${{ matrix.shard }}
          path: test-results
          retention-days: 7
      - name: Toolshop logs
        if: ${{ failure() }}
        run: ./scripts/toolshop.sh logs

  visual:
    name: Visual regression (3 viewports)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Toolshop (Docker)
        run: ./scripts/toolshop.sh up
      - name: Check baselines exist
        run: |
          if ! ls tests/__screenshots__/visual-*/*-linux.png >/dev/null 2>&1; then
            echo "::error::No Linux baselines committed. Run the 'Update visual baselines' workflow once."
            exit 1
          fi
      # Same pinned image as update-snapshots.yml, so rendering (fonts, Chromium build) is identical.
      - name: Compare screenshots (official Playwright image)
        run: ./scripts/playwright-docker.sh --project=visual-mobile --project=visual-tablet --project=visual-desktop
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-visual
          path: blob-report
          retention-days: 3
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-visual
          path: allure-results
          retention-days: 3
      - name: Upload diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failures-visual
          path: test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse CI budgets
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start Toolshop (Docker)
        run: ./scripts/toolshop.sh up
      - name: Lighthouse CI (accessibility & best-practices gate, performance budgets)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: lhci-report
          retention-days: 14

  report:
    name: Merge reports
    needs: [e2e, visual, lighthouse]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Single HTML report from every shard and job
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true
      - name: Restore Allure history from the published site
        run: ./scripts/allure-history.sh "${{ github.repository }}" allure-results/history
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run allure:generate

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-report
          path: lhci-report

      - name: Assemble site
        run: ./scripts/build-site.sh site
      - uses: actions/upload-artifact@v4
        with:
          name: reports-site
          path: site
          retention-days: 14
      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Publish reports to GitHub Pages
    needs: report
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
